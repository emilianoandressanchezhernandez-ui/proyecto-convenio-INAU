<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Detalle del Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="detalle-taller">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="mis-talleres.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Alumno
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div id="alerta-detalle-taller" class="alert alert-danger d-none" role="alert"></div>

        <div class="hero-panel mb-4">
            <h1 id="nombre-taller" class="fw-bold mb-2">
                Nombre del Taller
            </h1>
            <p id="descripcion-taller" class="text-muted mb-0">
                Descripción del taller.
            </p>
        </div>

        <!-- INFORMACIÓN GENERAL -->

        <div class="row g-3 mb-4">
            <div class="col-md-3 col-6">
                <div class="card hero-card h-100">
                    <div class="card-body">
                        <h6>Días</h6>
                        <span id="dias-taller">-</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card hero-card h-100">
                    <div class="card-body">
                        <h6>Horario</h6>
                        <span id="horario-taller">-</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card hero-card h-100">
                    <div class="card-body">
                        <h6>Ubicación</h6>
                        <span id="ubicacion-taller">-</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card hero-card h-100">
                    <div class="card-body">
                        <h6>Estado</h6>
                        <span id="estado-taller">-</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">
                            <i class="bi bi-person-badge me-1"></i>
                            Tallerista a cargo
                        </h5>
                        <p id="tallerista-nombre" class="mb-1 fw-semibold">-</p>
                        <p id="tallerista-correo" class="text-muted mb-0">-</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">
                            <i class="bi bi-graph-up-arrow me-1"></i>
                            Mi asistencia en este taller
                        </h5>
                        <p class="mb-2">
                            Promedio: <strong id="asistencia-promedio">-</strong>
                        </p>
                        <a id="enlace-asistencia" href="#" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-calendar-check"></i>
                            Ver mi historial
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- MATERIAL DEL TALLER -->

        <div class="card mb-4">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    <i class="bi bi-folder2-open me-1"></i>
                    Material del taller
                </h4>

                <div id="contenedor-materiales">
                    <p class="text-muted mb-0">
                        Cargando...
                    </p>
                </div>
            </div>
        </div>

        <!-- TAREAS DEL TALLER -->

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h4 class="fw-bold mb-0">
                        <i class="bi bi-file-earmark-text me-1"></i>
                        Tareas del taller
                    </h4>
                    <a id="enlace-todas-tareas" href="tareas.html" class="btn btn-sm btn-outline-primary">
                        Ver todas mis tareas
                    </a>
                </div>

                <div id="contenedor-tareas-taller">
                    <p class="text-muted mb-0">
                        Cargando...
                    </p>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/detalle-taller.js"></script>
</body>
</html>
