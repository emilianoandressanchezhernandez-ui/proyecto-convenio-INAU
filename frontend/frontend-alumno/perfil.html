<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="perfil">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <span id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Alumno
                </span>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mi Perfil
            </h1>
            <p class="text-muted mb-0">
                Consultá tus datos personales y actualizá tu información de contacto.
            </p>
        </div>

        <div id="alerta-perfil" class="alert d-none" role="alert"></div>

        <div class="row g-4">

            <!-- TARJETA DE PRESENTACIÓN -->

            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <div id="logo-circle-perfil" class="logo-circle mb-3">
                            <i class="bi bi-person-fill"></i>
                        </div>

                        <div class="d-flex justify-content-center gap-2 mb-4">
                            <label for="input-foto-perfil" class="btn btn-sm btn-outline-primary mb-0">
                                <i class="bi bi-camera-fill"></i>
                                Cambiar foto
                            </label>
                            <input type="file" id="input-foto-perfil" accept="image/jpeg,image/png" class="d-none">

                            <button id="btn-eliminar-foto" type="button" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                                Quitar
                            </button>
                        </div>

                        <h4 id="perfil-nombre">
                            Nombre Apellido
                        </h4>
                        <p id="perfil-rol" class="text-muted mb-0">
                            Alumno
                        </p>

                        <hr>

                        <div class="text-start small text-muted">
                            <p class="mb-1">
                                <strong>ID:</strong>
                                <span id="usuario-id">--</span>
                            </p>
                            <p class="mb-1">
                                <strong>Ingreso al programa:</strong>
                                <span id="fecha-ingreso">--</span>
                            </p>
                            <p class="mb-0">
                                <strong>Último acceso:</strong>
                                <span id="ultimo-acceso">--</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DATOS PERSONALES -->

            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">
                            <i class="bi bi-person-lines-fill me-1"></i>
                            Información personal
                        </h5>

                        <form id="form-perfil">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" id="nombre" class="form-control" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" id="apellido" class="form-control" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label for="cedula" class="form-label">Cédula</label>
                                    <input type="text" id="cedula" class="form-control" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label for="fecha-nacimiento" class="form-label">Fecha de nacimiento</label>
                                    <input type="text" id="fecha-nacimiento" class="form-control" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label for="correo" class="form-label">Correo electrónico</label>
                                    <input type="email" id="correo" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="text" id="telefono" class="form-control">
                                </div>
                                <div class="col-12">
                                    <label for="referente-adulto" class="form-label">Referente adulto</label>
                                    <input type="text" id="referente-adulto" class="form-control" readonly>
                                </div>
                                <div class="col-12">
                                    <label for="centro-referencia" class="form-label">Centro de referencia</label>
                                    <input type="text" id="centro-referencia" class="form-control" readonly>
                                </div>

                                <div class="col-12">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <label for="biografia" class="form-label mb-0">Biografía</label>
                                        <button
                                            type="button"
                                            id="btn-eliminar-biografia"
                                            class="btn btn-sm btn-outline-danger"
                                        >
                                            <i class="bi bi-trash"></i>
                                            Eliminar
                                        </button>
                                    </div>
                                    <textarea
                                        id="biografia"
                                        class="form-control mt-2"
                                        rows="3"
                                        maxlength="300"
                                        placeholder="Contanos un poco sobre vos..."
                                    ></textarea>
                                    <div class="form-text">
                                        Máximo 300 caracteres. Este texto es visible para tu tallerista.
                                    </div>
                                </div>

                                <div class="col-12">
                                    <hr>
                                    <p class="fw-bold mb-2">
                                        Cambiar contraseña (opcional)
                                    </p>
                                </div>

                                <div class="col-md-6">
                                    <label for="password" class="form-label">Nueva contraseña</label>
                                    <input type="password" id="password" class="form-control" autocomplete="new-password">
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmar-password" class="form-label">Confirmar contraseña</label>
                                    <input type="password" id="confirmar-password" class="form-control" autocomplete="new-password">
                                </div>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle-fill me-1"></i>
                                    Guardar cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
