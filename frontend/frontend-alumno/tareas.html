<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mis Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="tareas">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Alumno
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mis Tareas
            </h1>
            <p class="text-muted mb-0">
                Consultá el estado de tus tareas, entregá tus archivos y revisá tus notas.
            </p>
        </div>

        <div id="alerta-tareas" class="alert alert-danger d-none" role="alert"></div>

        <!-- FILTROS -->

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="filtro-taller" class="form-label">Taller</label>
                        <select id="filtro-taller" class="form-select">
                            <option value="">Todos los talleres</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="filtro-estado" class="form-label">Estado</label>
                        <select id="filtro-estado" class="form-select">
                            <option value="">Todos los estados</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Entregada">Entregada</option>
                            <option value="Corregida">Corregida</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="buscador-tareas" class="form-label">Buscar</label>
                        <input
                            type="text"
                            id="buscador-tareas"
                            class="form-control"
                            placeholder="Buscar por título..."
                        >
                    </div>
                </div>
            </div>
        </div>

        <div id="contenedor-tareas"></div>

        <div id="estado-vacio-tareas" class="text-center py-5 d-none">
            <i class="bi bi-file-earmark-x display-4 text-muted"></i>
            <p class="text-muted mt-3 mb-0">
                No se encontraron tareas con los filtros seleccionados.
            </p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/tareas.js"></script>
</body>
</html>
