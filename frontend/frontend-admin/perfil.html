<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Administrador
                </span>

                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <!-- CABECERA -->
        
        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mi Perfil
            </h1>

            <p class="text-muted mb-0">
                Información personal y configuración de la cuenta.
            </p>
        </div>

        <!-- PERFIL -->

        <div class="row g-4 mb-4">
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <div class="logo-circle mb-4">
                            <i class="bi bi-person-fill"></i>
                        </div>

                        <h3 id="nombre-completo">
                            Nombre Apellido
                        </h3>

                        <p class="text-muted">
                            Administrador
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <h4 class="fw-bold mb-4">
                            Información Personal
                        </h4>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <strong>Nombre Completo</strong>
                                <div id="perfil-nombre">
                                    -
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <strong>Cédula</strong>
                                <div id="perfil-cedula">
                                    -
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <strong>Correo Electrónico</strong>
                                <div id="perfil-correo">
                                    -
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <strong>Teléfono</strong>
                                <div id="perfil-telefono">
                                    -
                                </div>
                            </div>

                            <div class="col-md-6">
                                <strong>Rol</strong>
                                <div id="perfil-rol">
                                    Administrador
                                </div>
                            </div>

                            <div class="col-md-6">
                                <strong>Fecha de Registro</strong>
                                <div id="perfil-registro">
                                    -
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SEGURIDAD -->

        <div class="card mb-4">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    Seguridad
                </h4>

                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="password" id="password-actual" class="form-control" placeholder="Contraseña actual">
                    </div>

                    <div class="col-md-4">
                        <input type="password" id="password-nueva" class="form-control" placeholder="Nueva contraseña">
                    </div>
                    <div class="col-md-4">
                        <input type="password" id="password-confirmar" class="form-control" placeholder="Confirmar contraseña">
                    </div>
                </div>
            </div>
        </div>

        <!-- ACCIONES -->

        <div class="card">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    Acciones
                </h4>

                <div class="row g-3">
                    <div class="col-md-4">
                        <button id="btn-editar-perfil" class="btn btn-primary w-100">
                            <i class="bi bi-pencil-fill"></i>
                            Editar Perfil
                        </button>
                    </div>

                    <div class="col-md-4">
                        <button id="btn-guardar-password" class="btn btn-success w-100">
                            <i class="bi bi-shield-lock-fill"></i>
                            Cambiar Contraseña
                        </button>
                    </div>

                    <div class="col-md-4">
                        <button id="btn-cerrar-sesion" class="btn btn-danger w-100">
                            <i class="bi bi-box-arrow-right"></i>
                            Cerrar Sesión
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/perfil.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
