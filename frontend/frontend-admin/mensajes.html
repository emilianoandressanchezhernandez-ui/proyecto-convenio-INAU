<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mensajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    <span id="nombre-usuario">
                        Administrador
                    </span>
                </a>

                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mensajes
            </h1>

            <p class="text-muted mb-0">
                Gestión de comunicaciones del sistema.
            </p>
        </div>

        <!-- ESTADÍSTICAS -->

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-envelope-fill display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>

                        <p class="text-muted mb-0">
                            Enviados
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-person-workspace display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>

                        <p class="text-muted mb-0">
                            Talleristas
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-people-fill display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>

                        <p class="text-muted mb-0">
                            Alumnos
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-clock-history display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>

                        <p class="text-muted mb-0">
                            Pendientes
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- NUEVO MENSAJE -->

        <div class="card mb-4">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    Nuevo Mensaje
                </h4>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            Destinatario
                        </label>

                        <select id="destinatario" class="form-select">
                            <option>
                                Seleccionar destinatario
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Asunto
                        </label>
                        <input type="text" id="asunto" class="form-control">
                    </div>

                    <div class="col-12">
                        <label class="form-label">
                            Mensaje
                        </label>
                        <textarea id="mensaje" class="form-control" rows="6"></textarea>
                    </div>

                    <div class="col-12">
                        <button id="btn-enviar" class="btn btn-primary">
                            <i class="bi bi-send-fill"></i>
                            Enviar Mensaje
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- HISTORIAL -->

        <div class="card">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    Historial de Mensajes
                </h4>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Destinatario</th>
                                <th>Asunto</th>
                                <th>Estado</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-mensajes">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-5">
                                    Los mensajes aparecerán aquí cuando existan registros.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
    <script src="js/main.js"></script>
</body>
</html>
