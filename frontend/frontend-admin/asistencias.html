<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Asistencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    <span id="nombre-usuario">
                        Administrador
                    </span>
                </a>

                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Asistencias
            </h1>

            <p class="text-muted mb-0">
                Consulta y seguimiento de asistencias registradas.
            </p>
        </div>

        <!-- ESTADÍSTICAS -->

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-clipboard-check-fill display-5"></i>
                        <h3 class="mt-3" id="stat-registros">
                            --
                        </h3>

                        <p class="text-muted mb-0">
                            Registros
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-check-circle-fill display-5"></i>
                        <h3 class="mt-3" id="stat-presentes">

                            --

                        </h3>
                        <p class="text-muted mb-0">
                            Presentes
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-x-circle-fill display-5"></i>
                        <h3 class="mt-3" id="stat-ausentes">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Ausentes
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-graph-up-arrow display-5"></i>
                        <h3 class="mt-3" id="stat-promedio">
                            --
                        </h3>

                        <p class="text-muted mb-0">
                            Promedio
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- FILTROS -->

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <select id="filtro-taller" class="form-select">
                            <option>
                                Todos los talleres
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <input type="date" id="filtro-fecha" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <button id="btn-filtrar" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i>
                            Buscar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA -->

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Alumno</th>
                                <th>Taller</th>
                                <th>Estado</th>
                                <th>Tallerista</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-asistencias">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-5">
                                    Las asistencias aparecerán aquí cuando existan registros.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: CORREGIR ASISTENCIA -->

    <div class="modal fade" id="modal-corregir-asistencia" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Corregir Asistencia
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div id="alerta-corregir-asistencia" class="alert alert-danger d-none" role="alert"></div>

                    <p class="mb-1"><strong>Alumno:</strong> <span id="corregir-alumno"></span></p>
                    <p class="mb-1"><strong>Taller:</strong> <span id="corregir-taller"></span></p>
                    <p class="mb-3"><strong>Fecha:</strong> <span id="corregir-fecha"></span></p>

                    <div class="mb-3">
                        <label for="corregir-estado" class="form-label">Estado</label>
                        <select id="corregir-estado" class="form-select">
                            <option value="Presente">Presente</option>
                            <option value="Ausente">Ausente</option>
                            <option value="Justificado">Justificado</option>
                            <option value="Tardanza">Tardanza</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btn-guardar-correccion" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/asistencias.js"></script>
</body>

</html>
