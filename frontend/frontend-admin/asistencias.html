<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Asistencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    <span id="nombre-usuario">
                        Administrador
                    </span>
                </a>

                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Asistencias
            </h1>

            <p class="text-muted mb-0">
                Consulta y seguimiento de asistencias registradas.
            </p>
        </div>

        <!-- ESTADÍSTICAS -->

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-clipboard-check-fill display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>

                        <p class="text-muted mb-0">
                            Registros
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-check-circle-fill display-5"></i>
                        <h3 class="mt-3">

                            --

                        </h3>
                        <p class="text-muted mb-0">
                            Presentes
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-x-circle-fill display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Ausentes
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-graph-up-arrow display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>

                        <p class="text-muted mb-0">
                            Promedio
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- FILTROS -->

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <select id="filtro-taller" class="form-select">
                            <option>
                                Todos los talleres
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <input type="date" id="filtro-fecha" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <button id="btn-filtrar" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i>
                            Buscar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA -->

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Alumno</th>
                                <th>Taller</th>
                                <th>Estado</th>
                                <th>Tallerista</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-asistencias">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-5">
                                    Las asistencias aparecerán aquí cuando existan registros.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
