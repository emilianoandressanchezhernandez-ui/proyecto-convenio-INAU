<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="frontend-tallerista/css/styles.css">
</head>

<body class="body-login">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card login-card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="logo-circle">
                                <i class="bi bi-mortarboard-fill"></i>
                            </div>
                            <h1 class="mt-4 fw-bold">
                                INAU
                            </h1>
                            <p class="text-muted">
                                Sistema de Gestión de Talleres
                            </p>
                        </div>
                        <div id="alerta-error" class="alert alert-danger d-none"></div>
                        <form id="form-login">
                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    Correo electrónico
                                </label>
                                <input type="email" class="form-control" id="correo" placeholder="usuario@ejemplo.com"
                                    autocomplete="username" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password"
                                    autocomplete="current-password" required>
                            </div>
                            <button type="submit" id="btn-login" class="btn btn-primary w-100">
                                Ingresar
                            </button>

                            <div class="text-center mt-4">
                                <p class="small text-muted mb-2">
                                    Al utilizar esta plataforma, se aplican las
                                    condiciones de uso y las disposiciones de privacidad
                                    correspondientes.
                                </p>

                                <div class="d-flex flex-wrap justify-content-center gap-2">
                                    <a href="terminos.html" class="small text-decoration-none" target="_blank"
                                        rel="noopener noreferrer">
                                        <i class="bi bi-file-text me-1"></i>
                                        Términos y Condiciones
                                    </a>

                                    <span class="text-muted">|</span>

                                    <a href="privacidad.html" class="small text-decoration-none" target="_blank"
                                        rel="noopener noreferrer">
                                        <i class="bi bi-shield-lock me-1"></i>
                                        Política de Privacidad
                                    </a>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
