<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Corregir Tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="correccion-tarea">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="material.html" id="enlace-volver-correccion" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Tallerista
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 id="titulo-tarea" class="fw-bold mb-2">
                Corregir Tarea
            </h1>
            <p class="text-muted mb-0" id="descripcion-tarea">
                Información de la tarea seleccionada.
            </p>
        </div>

        <div id="alerta-correccion-tarea" class="alert d-none" role="alert" aria-live="polite"></div>

        <!-- DATOS DE LA TAREA -->

        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <strong>Taller:</strong>
                        <div id="taller-tarea">-</div>
                    </div>
                    <div class="col-md-4">
                        <strong>Fecha Límite:</strong>
                        <div id="fecha-limite-tarea">-</div>
                    </div>
                    <div class="col-md-4">
                        <strong>Entregas:</strong>
                        <div id="resumen-entregas">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA DE ENTREGAS -->

        <div class="card">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    Entregas de Alumnos
                </h4>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Alumno</th>
                                <th>Fecha de Entrega</th>
                                <th>Archivo</th>
                                <th>Estado</th>
                                <th>Nota</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-entregas">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-5">
                                    Las entregas aparecerán aquí.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: CORREGIR ENTREGA -->

    <div class="modal fade" id="modal-corregir-entrega" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Corregir Entrega
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div id="alerta-corregir-entrega" class="alert alert-danger d-none" role="alert"></div>

                    <p class="mb-1"><strong>Alumno:</strong> <span id="corregir-alumno"></span></p>
                    <p class="mb-3"><strong>Archivo entregado:</strong> <span id="corregir-archivo"></span></p>

                    <div class="mb-3">
                        <label for="corregir-nota" class="form-label">Nota (1 a 10)</label>
                        <input type="number" id="corregir-nota" class="form-control" min="1" max="10">
                    </div>

                    <div class="mb-3">
                        <label for="corregir-comentario" class="form-label">Comentario</label>
                        <textarea id="corregir-comentario" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btn-guardar-correccion" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/correccion-tarea.js"></script>
</body>

</html>
