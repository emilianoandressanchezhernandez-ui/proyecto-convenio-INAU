<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="perfil">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>
            <div class="d-flex align-items-center gap-3">
                <span id="nombre-usuario">
                    Tallerista
                </span>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>
    <main class="container py-5">

        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mi Perfil
            </h1>
            <p class="text-muted mb-0">
                Consulta y actualiza la información de tu cuenta.
            </p>
        </div>

        <div id="alerta-perfil" class="alert d-none" role="alert" aria-live="polite"></div>

        <div class="row g-4">

            <!-- PERFIL -->

            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <div class="logo-circle mb-4">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h4 id="perfil-nombre" class="fw-bold">
                            Nombre Apellido
                        </h4>
                        <p id="perfil-rol" class="text-muted">
                            Tallerista
                        </p>
                    </div>
                </div>
            </div>

            <!-- DATOS -->

            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <h4 class="fw-bold mb-4">
                            Información Personal
                        </h4>
                        <form id="form-perfil">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">
                                        Nombre
                                    </label>
                                    <input
                                        type="text"
                                        id="nombre"
                                        class="form-control bg-light"
                                        autocomplete="given-name"
                                        readonly
                                        aria-readonly="true"
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label for="apellido" class="form-label">
                                        Apellido
                                    </label>
                                    <input
                                        type="text"
                                        id="apellido"
                                        class="form-control bg-light"
                                        autocomplete="family-name"
                                        readonly
                                        aria-readonly="true"
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label for="cedula" class="form-label">
                                        Cédula
                                    </label>
                                    <input
                                        type="text"
                                        id="cedula"
                                        class="form-control bg-light"
                                        autocomplete="off"
                                        readonly
                                        aria-readonly="true"
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label for="correo" class="form-label">
                                        Correo Electrónico
                                    </label>
                                    <input
                                        type="email"
                                        id="correo"
                                        class="form-control"
                                        autocomplete="email"
                                        required
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">
                                        Teléfono
                                    </label>
                                    <input
                                        type="tel"
                                        id="telefono"
                                        class="form-control"
                                        autocomplete="tel"
                                        required
                                    >
                                </div>

                            </div>

                            <hr class="my-4">
                            <h5 class="fw-bold mb-3">
                                Seguridad
                            </h5>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="password" class="form-label">
                                        Nueva Contraseña
                                    </label>
                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        autocomplete="new-password"
                                        minlength="8"
                                    >
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmar-password" class="form-label">
                                        Confirmar Contraseña
                                    </label>
                                    <input
                                        type="password"
                                        id="confirmar-password"
                                        class="form-control"
                                        autocomplete="new-password"
                                        minlength="8"
                                    >
                                </div>
                            </div>
                            
                            <div class="mt-4">
                                <button
                                    type="submit"
                                    id="btn-guardar-perfil"
                                    class="btn btn-primary"
                                >

                                    <i class="bi bi-save-fill"></i>
                                    Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- INFORMACIÓN DE CUENTA -->

        <div class="card mt-4">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    Información de la Cuenta
                </h4>

                <div class="row">
                    <div class="col-md-4">
                        <p>
                            <strong>ID Usuario:</strong>
                            <span id="usuario-id">
                                --
                            </span>
                        </p>
                    </div>

                    <div class="col-md-4">
                        <p>
                            <strong>Fecha de Registro:</strong>
                            <span id="fecha-registro">
                                --
                            </span>
                        </p>
                    </div>
                    <div class="col-md-4">
                        <p>
                            <strong>Último Acceso:</strong>
                            <span id="ultimo-acceso">
                                --
                            </span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
