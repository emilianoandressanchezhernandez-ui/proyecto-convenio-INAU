<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Material y Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="material">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" id="enlace-volver-material" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Tallerista
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Material y Tareas
            </h1>
            <p class="text-muted mb-0">
                Gestioná el material y las tareas de tus talleres.
            </p>
        </div>

        <div id="alerta-material" class="alert d-none" role="alert" aria-live="polite"></div>

        <!-- RESUMEN -->

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-collection display-5"></i>
                        <h3 id="stat-total" class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Total
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-file-earmark-richtext display-5"></i>
                        <h3 id="stat-materiales" class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Materiales
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-pencil-square display-5"></i>
                        <h3 id="stat-tareas" class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Tareas
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- FILTROS Y ALTA -->

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="filtro-taller-material" class="form-label">
                            Taller
                        </label>
                        <select id="filtro-taller-material" class="form-select">
                            <option value="">Todos mis talleres</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filtro-tipo-material" class="form-label">
                            Tipo
                        </label>
                        <select id="filtro-tipo-material" class="form-select">
                            <option value="">Todos</option>
                            <option value="Material">Material</option>
                            <option value="Tarea">Tarea</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="buscar-material" class="form-label">
                            Buscar
                        </label>
                        <input type="text" class="form-control" id="buscar-material" placeholder="Título">
                    </div>
                    <div class="col-md-2">
                        <button type="button" id="btn-nuevo-material" class="btn btn-primary w-100">
                            <i class="bi bi-plus-circle"></i>
                            Nuevo
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA -->

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Taller</th>
                                <th>Tipo</th>
                                <th>Fecha</th>
                                <th>Fecha Límite</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-material">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-5">
                                    El material y las tareas aparecerán aquí cuando existan registros.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: NUEVO CONTENIDO -->

    <div class="modal fade" id="modal-nuevo-material" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Nuevo Material o Tarea
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div id="alerta-nuevo-material" class="alert alert-danger d-none" role="alert"></div>

                    <form id="form-nuevo-material">
                        <div class="mb-3">
                            <label for="nuevo-material-taller" class="form-label">Taller</label>
                            <select id="nuevo-material-taller" class="form-select" required>
                                <option value="">Seleccionar...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="nuevo-material-tipo" class="form-label">Tipo</label>
                            <select id="nuevo-material-tipo" class="form-select" required>
                                <option value="Material">Material (solo lectura)</option>
                                <option value="Tarea">Tarea (requiere entrega)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="nuevo-material-titulo" class="form-label">Título</label>
                            <input type="text" id="nuevo-material-titulo" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="nuevo-material-descripcion" class="form-label">Descripción</label>
                            <textarea id="nuevo-material-descripcion" class="form-control" rows="3" required></textarea>
                        </div>

                        <div class="mb-3" id="contenedor-fecha-limite">
                            <label for="nuevo-material-fecha-limite" class="form-label">Fecha Límite</label>
                            <input type="date" id="nuevo-material-fecha-limite" class="form-control">
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btn-guardar-nuevo-material" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/material.js"></script>
</body>

</html>
