<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mensajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="mensajes">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Tallerista
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>
    <main class="container py-5">

        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mensajes
            </h1>
            <p class="text-muted mb-0">
                Comunicación entre talleristas y administración.
            </p>
        </div>

        <div id="alerta-mensajes" class="alert d-none" role="alert" aria-live="polite"></div>
        <div class="row g-4">

            <!-- LISTA DE CONVERSACIONES -->

            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h4 class="fw-bold mb-3">
                            Conversaciones
                        </h4>
                        <div id="lista-conversaciones" class="list-group list-group-flush">
                            <div class="text-center text-muted py-4">
                                <div
                                    class="spinner-border spinner-border-sm"
                                    role="status"
                                >
                                    <span class="visually-hidden">
                                        Cargando conversaciones...
                                    </span>
                                </div>

                                <p class="mt-2 mb-0">
                                    Cargando conversaciones...
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MENSAJES -->

            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4
                                id="titulo-conversacion"
                                class="fw-bold mb-0"
                            >
                                Selecciona una conversación
                            </h4>

                            <span
                                id="estado-chat"
                                class="badge text-bg-secondary"
                            >
                                Sin seleccionar
                            </span>
                        </div>

                        <!-- CONTENEDOR MENSAJES -->

                        <div id="contenedor-mensajes" class="border rounded p-3 mb-4" aria-live="polite">
                            <div class="text-center text-muted py-5">
                                <i class="bi bi-chat-dots display-4"></i>

                                <p class="mt-3 mb-0">
                                    Selecciona una conversación para ver los mensajes.
                                </p>
                            </div>
                        </div>

                        <!-- FORMULARIO -->

                        <form id="form-mensaje">
                            <div class="row g-3">
                                <div class="col-md-10">
                                    <input type="text" id="mensaje" class="form-control" placeholder="Escribe un mensaje...">
                                </div>
                                <div class="col-md-2">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="bi bi-send-fill"></i>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
