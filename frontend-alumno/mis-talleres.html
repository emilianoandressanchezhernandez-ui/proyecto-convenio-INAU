<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mis Talleres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="mis-talleres">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Alumno
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mis Talleres
            </h1>
            <p class="text-muted mb-0">
                Talleres en los que estás inscripto actualmente.
            </p>
        </div>

        <div id="alerta-talleres" class="alert alert-danger d-none" role="alert"></div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input
                        type="text"
                        id="buscador-talleres"
                        class="form-control"
                        placeholder="Buscar por nombre o estado..."
                    >
                    <button id="btn-buscar" class="btn btn-primary" type="button">
                        <i class="bi bi-search"></i>
                        Buscar
                    </button>
                </div>
            </div>
        </div>

        <div id="contenedor-talleres" class="row g-4"></div>

        <div id="estado-vacio" class="text-center py-5 d-none">
            <i class="bi bi-journal-x display-4 text-muted"></i>
            <p class="text-muted mt-3 mb-0">
                No se encontraron talleres con ese criterio de búsqueda.
            </p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/mis-talleres.js"></script>
</body>
</html>
