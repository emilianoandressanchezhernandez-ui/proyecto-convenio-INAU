<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mi Asistencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="asistencia">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Alumno
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mi Asistencia
            </h1>
            <p class="text-muted mb-0">
                Consultá tu historial de asistencia registrado por los talleristas. Esta información es de solo lectura.
            </p>
        </div>

        <div id="alerta-asistencia" class="alert alert-danger d-none" role="alert"></div>

        <!-- RESUMEN -->

        <div class="row g-3 mb-4">
            <div class="col-md-4 col-6">
                <div class="card hero-card h-100">
                    <div class="card-body">
                        <h6>Asistencia general</h6>
                        <span id="resumen-porcentaje">-</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-6">
                <div class="card hero-card h-100">
                    <div class="card-body">
                        <h6>Presentes</h6>
                        <span id="resumen-presentes">-</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-6">
                <div class="card hero-card h-100">
                    <div class="card-body">
                        <h6>Ausencias</h6>
                        <span id="resumen-ausencias">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- FILTRO -->

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label for="filtro-taller-asistencia" class="form-label">Taller</label>
                        <select id="filtro-taller-asistencia" class="form-select">
                            <option value="">Todos los talleres</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA -->

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Taller</th>
                                <th>Estado</th>
                                <th>Observaciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-asistencia">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">
                                    Cargando...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/asistencia.js"></script>
</body>
</html>
