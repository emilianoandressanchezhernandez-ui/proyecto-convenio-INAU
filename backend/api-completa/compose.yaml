name: api-completa

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inau_talleres
      MYSQL_USER: utu_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Debes configurar DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Debes configurar MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "${MYSQL_PORT:-127.0.0.1:3308}:3306"
    volumes:
      # Los datos sobreviven aunque se detengan o vuelvan a crear los containers.
      - mysql_data:/var/lib/mysql

      # MySQL ejecuta este archivo solamente la primera vez que crea el volumen.
      - ./DataBase/inau_talleres.sql:/docker-entrypoint-initdb.d/01-database.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?Debes configurar SECRET_KEY en .env}
      TOKEN_LIFETIME: ${TOKEN_LIFETIME:-3600}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8000}
      DB_HOST: database
      DB_NAME: inau_talleres
      DB_USER: utu_user
      DB_PASSWORD: ${DB_PASSWORD:?Debes configurar DB_PASSWORD en .env}
    ports:
      - "${API_PORT:-127.0.0.1:8002}:80"
    volumes:
      - uploads_data:/var/www/html/uploads
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data: