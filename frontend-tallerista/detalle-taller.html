<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Detalle del Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="mis-talleres.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Tallerista
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>
    <main class="container py-5">

        <!-- INFORMACIÓN GENERAL -->

        <div class="hero-panel mb-4">
            <h1 id="nombre-taller" class="fw-bold mb-2">
                Nombre del Taller
            </h1>

            <p id="descripcion-taller" class="text-muted mb-0">

                Descripción del taller.
            </p>
        </div>

        <!-- DATOS PRINCIPALES -->

        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">
                            <i class="bi bi-calendar-event"></i>
                            Horarios
                        </h5>
                        <p id="dias-taller" class="mb-2">
                            -
                        </p>
                        <p id="horario-taller" class="mb-0">
                            -
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">
                            <i class="bi bi-geo-alt-fill"></i>
                            Ubicación
                        </h5>
                        <p id="ubicacion-taller" class="mb-0">
                            -
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- RESUMEN -->

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-people-fill display-5"></i>
                        <h3 id="cantidad-alumnos" class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Alumnos
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-check-circle-fill display-5"></i>
                        <h3 id="asistencia-promedio" class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Asistencia
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-clock-fill display-5"></i>
                        <h3 id="estado-taller" class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Estado
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ACCIONES -->

        <div class="card">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    Acciones
                </h4>
                <div class="row g-3">
                    <div class="col-md-4">
                        <a href="asistencia.html" class="btn btn-primary w-100">
                            <i class="bi bi-check2-square"></i>
                            Tomar Asistencia
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="informes.html" class="btn btn-primary w-100">
                            <i class="bi bi-bar-chart-fill"></i>
                            Ver Informes
                        </a>
                    </div>
                    <div class="col-md-4">
                        <button id="btn-ver-alumnos" class="btn btn-primary w-100">
                            <i class="bi bi-people-fill"></i>
                            Alumnos
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/detalle-taller.js"></script>
</body>
</html>
