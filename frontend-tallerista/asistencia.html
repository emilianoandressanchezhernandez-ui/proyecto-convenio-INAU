<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Asistencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-dark navbar-custom">
        <div class="container">
            <a href="dashboard.html" class="btn btn-light">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span id="nombre-taller" class="navbar-brand mx-auto fw-bold"></span>
        </div>
    </nav>
    <main class="container py-4">
        <div class="card hero-card mb-4">
            <div class="card-body">
                <div class="row text-center">
                    <div class="col-md-4 mb-3 mb-md-0">
                        <h6>Fecha</h6>
                        <span id="info-fecha"></span>
                    </div>
                    <div class="col-md-4 mb-3 mb-md-0">
                        <h6>Horario</h6>
                        <span id="info-horario"></span>
                    </div>
                    <div class="col-md-4">
                        <h6>Presentes</h6>
                        <span id="contador-presentes"></span>
                    </div>
                </div>
            </div>
        </div>
        <div id="alerta-asistencia" class="alert alert-danger d-none"></div>

        <div id="loading-spinner" class="text-center py-5 d-none">
            <div class="spinner-border" role="status"></div>
        </div>
        <div id="contenedor-tabla" class="card">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>
                                Participante
                            </th>
                            <th>
                                Cédula
                            </th>
                            <th>
                                Asistencia
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alumnos">

                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-4">
            <button id="btn-guardar-asistencia" class="btn btn-success w-100">
                Guardar asistencia
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/asistencia.js"></script>
</body>
</html>
