<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Informes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>

            <div class="d-flex align-items-center gap-3">
                <span id="nombre-usuario">
                    Tallerista
                </span>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>
    <main class="container py-5">

        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Informes
            </h1>
            <p class="text-muted mb-0">
                Consulta los informes y registros de tus talleres.
            </p>
        </div>

        <!-- RESUMEN -->

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-file-earmark-text display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Informes Totales
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-calendar-check display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Este Mes
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-graph-up-arrow display-5"></i>
                        <h3 class="mt-3">
                            --
                        </h3>
                        <p class="text-muted mb-0">
                            Última Actualización
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- FILTROS -->

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">
                            Desde
                        </label>
                        <input type="date" class="form-control" id="fecha-desde">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">
                            Hasta
                        </label>
                        <input type="date" class="form-control" id="fecha-hasta">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">
                            Buscar
                        </label>
                        <input type="text" class="form-control" id="buscar-informe" placeholder="Nombre del informe">
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA -->

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Taller</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-informes">
                            <!-- JS insertará informes aquí -->
                            <tr>
                                <td colspan="5" class="text-center text-muted py-5">
                                    Los informes aparecerán aquí cuando existan registros.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
