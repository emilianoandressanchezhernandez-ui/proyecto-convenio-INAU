<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INAU - Mis Talleres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand fw-bold">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Volver
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="perfil.html" id="nombre-usuario" class="text-white text-decoration-none fw-semibold">
                    <i class="bi bi-person-circle"></i>
                    Tallerista
                </a>
                <button id="btn-logout" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <!-- CABECERA -->

        <div class="hero-panel mb-4">
            <h1 class="fw-bold mb-2">
                Mis Talleres
            </h1>
            <p class="text-muted mb-0">
                Consulta y gestión de los talleres asignados.
            </p>
        </div>

        <!-- BUSCADOR -->

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" id="buscador-talleres" class="form-control" placeholder="Buscar taller...">
                    </div>

                    <div class="col-md-4">
                        <button id="btn-buscar" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i>
                            Buscar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MENSAJES -->

        <div
            id="alerta-talleres"
            class="alert alert-danger d-none">
        </div>

        <!-- LOADING -->

        <div id="loading-spinner" class="text-center py-5 d-none">
            <div class="spinner-border" role="status">
            </div>
        </div>

        <!-- ESTADO VACÍO -->

        <div id="estado-vacio" class="card d-none">
            <div class="card-body text-center py-5">
                <i class="bi bi-journal-x display-3"></i>
                <h3 class="mt-3">
                    No hay talleres disponibles
                </h3>
                <p class="text-muted mb-0">
                    Cuando existan talleres asignados aparecerán aquí.
                </p>
            </div>
        </div>

        <!-- CONTENEDOR DE TALLERES -->

        <div id="contenedor-talleres" class="row g-4">
            <!-- El JavaScript insertará aquí las tarjetas de cada taller -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
